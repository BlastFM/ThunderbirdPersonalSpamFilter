    <rect x="94" y="355" width="300" height="36" rx="9"/><rect x="94" y="433" width="414" height="36" rx="9"/><rect x="94" y="511" width="414" height="36" rx="9"/><rect x="94" y="589" width="414" height="36" rx="9"/><rect x="94" y="667" width="414" height="36" rx="9"/><rect x="94" y="745" width="414" height="58" rx="9"/>
  </g>
