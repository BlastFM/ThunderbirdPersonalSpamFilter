  <rect x="864" y="320" width="102" height="36" rx="18" fill="#fff" stroke="#d75946"/><text x="915" y="343" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#c34839">× Clear log</text>
  <rect x="596" y="382" width="590" height="108" rx="11" fill="#f8fafc" stroke="#cdebdc"/>
  <circle cx="618" cy="408" r="7" fill="#d75946"/>
  <text x="636" y="413" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#162a36">Example suspicious message</text>
  <rect x="1058" y="397" width="103" height="25" rx="13" fill="#e9f8ed"/><text x="1109" y="414" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#208b3a">LATEST</text>
  <text x="618" y="441" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#687984">Moved to the configured spam destination after classification.</text>
  <rect x="618" y="454" width="150" height="25" rx="13" fill="#fff" stroke="#16a085"/><text x="693" y="471" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#16a085">Mark as Not Spam</text>
  <line x1="596" y1="520" x2="1186" y2="520" stroke="#dce6ea"/>
  <text x="596" y="560" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#16a085">LEARNING</text>
  <text x="596" y="592" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#162a36">Active AI Training Memory (Not Spam)</text>
  <rect x="1014" y="570" width="172" height="36" rx="18" fill="#fff" stroke="#d75946"/><text x="1100" y="593" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#c34839">× Clear memory</text>
  <text x="891" y="680" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#687984">No false positives recorded.</text>
  <text x="640" y="825" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#687984">OpenAI Spam Detector 1.4.6 is offered FREE by </text><text x="1034" y="825" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#162a36">BlastFM Limited</text><text x="1160" y="825" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#687984">.</text>
