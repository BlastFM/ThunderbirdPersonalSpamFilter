  <text x="94" y="272" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#162a36">Configuration</text>
  <text x="94" y="298" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#687984">Connect your account and define how messages should be handled.</text>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#162a36" font-size="13" font-weight="600">
    <text x="94" y="345">OpenAI API Key</text><text x="94" y="423">OpenAI Model</text><text x="94" y="501">Spam Action Destination</text><text x="94" y="579">Domain Whitelist (Always Safe / Skip AI)</text><text x="94" y="657">Domain Blacklist (Always Spam / Skip AI)</text><text x="94" y="735">Custom Classification Prompt Rules</text>
  </g>
