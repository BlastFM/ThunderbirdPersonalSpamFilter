  <text x="596" y="272" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#162a36">Detected Spam Log</text>
  <text x="596" y="298" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#687984">Review messages moved by the filter and manage your data.</text>
