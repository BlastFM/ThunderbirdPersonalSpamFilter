name: Package Thunderbird Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build XPI Package
        id: package
        run: |
          version=$(jq -r '.version' manifest.json)
          archive="openai-spam-detector-v${version}.xpi"
          zip -r "$archive" manifest.json options background.js icons docs README.md LICENSE -x "*.git*"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openai-spam-detector-xpi
          path: ${{ steps.package.outputs.archive }}

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.archive }}
          generate_release_notes: true
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}