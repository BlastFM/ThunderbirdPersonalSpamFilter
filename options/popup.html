<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thunderbird OpenAI Spam Detector</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      padding: 16px;
      margin: 0;
      background-color: #f8fafc;
      color: #1f2937;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .header img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }
    .header h1 {
      font-size: 0.95rem;
      margin: 0;
      font-weight: 700;
    }
    p {
      font-size: 0.8rem;
      color: #6b7280;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 8px;
      background: #208b3a;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
      transition: background-color 0.15s ease;
    }
    .btn:hover {
      background: #15732e;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon-48.png" alt="Logo">
    <h1>Thunderbird OpenAI Spam Detector</h1>
  </div>
  <p>Active and monitoring incoming email using OpenAI models.</p>
  <button id="openOptions" class="btn">Open Settings & Logs</button>

  <script src="popup.js"></script>
</body>
</html>
